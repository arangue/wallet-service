services:
  wallet-db:
    container_name: wallet-postgres
    image: postgres:17-alpine
    restart: always
    environment:
      POSTGRES_USER: user
      POSTGRES_PASSWORD: password
      POSTGRES_DB: wallet_db
    ports:
      - "5434:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U user -d wallet_db"]
      interval: 5s
      timeout: 5s
      retries: 5
    networks:
      - wallet-network

  wallet-app:
    container_name: wallet-service
    build:
      context: .
      dockerfile: Dockerfile
    ports:
      - "8080:8080"
    environment:
      - DATABASE_URL=postgres://user:password@wallet-db:5432/wallet_db?sslmode=disable
      - PORT=8080
    depends_on:
      wallet-db:
        condition: service_healthy
    restart: on-failure
    networks:
      - wallet-network

networks:
  wallet-network:
    driver: bridge

volumes:
  postgres_data:
